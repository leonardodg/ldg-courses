# Sem composer e npm: as dependencias de la sao do upstream do Moodle, e um PR
# aqui viraria conflito na proxima sincronizacao.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: docker
    directory: /.devcontainer/build
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
