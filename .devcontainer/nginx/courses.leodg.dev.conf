# =============================================================================
# nginx - VPS Oracle - courses.leodg.dev
# =============================================================================
# Instalar em /etc/nginx/sites-available/ e linkar em sites-enabled/.
#
# O nginx termina TLS e encaminha em HTTP para o container (MOODLE_HTTP_PORT).
# O Moodle sabe que esta atras de proxy por $CFG->sslproxy = true, que ja vem
# ligado em .devcontainer/config/config-docker.php.
#
# Dois headers sao OBRIGATORIOS e nao podem ser omitidos:
#   Host              -> a Fase 3 (dominio por vendedor) resolve a empresa por ele
#   X-Forwarded-Proto -> sem isso o Moodle monta URL http:// dentro de pagina https
# =============================================================================

# 8080/8081/8082 ja estao ocupadas nesta VPS por outros servicos.
# O container publica a 8095 apenas em 127.0.0.1 (BIND_ADDR no .env).
upstream ldg_courses {
    server 127.0.0.1:8095;
    keepalive 32;
}

# --- HTTP: so redireciona. O certbot injeta o desafio ACME aqui. -------------
server {
    listen 80;
    listen [::]:80;
    server_name courses.leodg.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ------------------------------------------------------------------
server {
    # Sintaxe do nginx 1.24 (a da VPS). O "http2 on;" separado so existe a
    # partir do 1.25.1 e quebra aqui com: unknown directive "http2".
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name courses.leodg.dev;

    # Preenchido pelo certbot --nginx.
    ssl_certificate     /etc/letsencrypt/live/courses.leodg.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/courses.leodg.dev/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Upload de curso/backup. Tem que ser >= PHP_UPLOAD_MAX_FILESIZE (100M).
    # Se ficar menor, o nginx corta o upload com 413 antes de chegar no PHP.
    client_max_body_size 128M;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # O Moodle publica upgrade.txt e readme em public/, e eles revelam a versao.
    # Exige um diretorio simples antes do arquivo: robots.txt e llms.txt, na
    # raiz, passam, e pluginfile.php/.../x.txt tem ponto no caminho e tambem.
    location ~* ^/[a-z0-9_]+/(?:[^.]*/)?[^/]+\.(?:txt|md)$ {
        return 404;
    }

    # Restore de backup e upgrade de plugin passam facil de 60s.
    proxy_connect_timeout 60s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # IP REAL DO VISITANTE.
    #
    # O dominio esta atras do proxy da Cloudflare, entao a conexao chega da
    # rede DELES. Sem isto o nginx trata o IP da Cloudflare como sendo o do
    # visitante, e o Moodle grava esse IP em todo log de acesso, no "ultimo
    # acesso de" e no relatorio de atividade - dado que nao da para corrigir
    # depois.
    #
    # As faixas mudam de tempos em tempos; regenere com
    # .devcontainer/nginx/atualiza-cloudflare-ips.sh
    include /etc/nginx/snippets/cloudflare-realip.conf;

    # COMPRESSAO.
    #
    # Medido em 10/09/2026, sem compressao nenhuma: a landing publica baixava
    # 1.805 KB, e 1.211 deles eram JavaScript do proprio Moodle - core/first.js
    # sozinho tem 931 KB. Nada disso e conteudo nosso, e nada disso da para
    # remover: e o runtime que qualquer pagina do Moodle carrega.
    #
    # O que da para fazer e nao mandar tudo isso cru pela rede. Texto comprime
    # em torno de 70%, e este e de longe o maior ganho de velocidade disponivel
    # para a pagina publica - maior que qualquer coisa no CSS ou na imagem.
    #
    # A Cloudflare tambem comprime na borda, mas so o que ELA busca de nos: sem
    # isto aqui, o trafego origem-borda continua cru.
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    # Abaixo de 1 KB o cabecalho custa mais que a economia.
    gzip_min_length   1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    access_log /var/log/nginx/courses.leodg.dev.access.log;
    error_log  /var/log/nginx/courses.leodg.dev.error.log;

    location / {
        proxy_pass http://ldg_courses;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_buffering off;
        proxy_set_header Connection "";
    }
}

# =============================================================================
# Dominio por vendedor
# =============================================================================
# Cada dominio de vendedor vira um server block proprio, gerado a partir de
# .devcontainer/nginx/vendor-domain.conf.template:
#
#   sudo ./provisiona-dominio.sh meuscursos.joao.com contato@leodg.dev
#
# O nginx NAO precisa saber qual empresa e qual: ele so preserva o header Host,
# e quem resolve empresa, tema e wwwroot e o mapa gerado no dataroot, lido pelo
# config.php antes do lib/setup.php.
#
# A seguranca nao depende desses blocos. Um dominio que chegue sem estar
# cadastrado no banco nao vira wwwroot - o config.php usa o Host apenas como
# chave numa lista gerada, e chave ausente nao entra no if.
# =============================================================================
