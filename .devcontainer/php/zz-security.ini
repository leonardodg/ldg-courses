; Valores de seguranca que nao podem depender do php.ini de cada target.
;
; O target production copia o php.ini-production, e o development o
; php-dev-custom.ini: um valor posto so num deles some quando a VPS troca de
; target. Este arquivo fica no conf.d da base, que e lido depois do php.ini, e
; o prefixo zz- o poe por ultimo entre os do conf.d.
;
; O build do target production confere o valor efetivo (moodle.Dockerfile), e
; o deploy confere de novo no container que subiu (deploy.yml).

; CVE-2026-115560 (PHP2Shell, terceira): object injection sem autenticacao
; quando o upload progress esta ligado. O PHP 8.4.28 (19/11/2026) muda o
; padrao para 0, mas valor explicito vence o padrao, entao fica explicito
; aqui. Nenhum codigo do Moodle usa upload progress.
session.upload_progress.enabled = 0
