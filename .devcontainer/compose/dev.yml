# =============================================================================
# DEVELOPMENT - Local development with hot-reload
# =============================================================================
# Usage:
#     docker compose -f .devcontainer/compose/base.yml -f .devcontainer/compose/db.yml -f .devcontainer/compose/dev.yml up -d
# =============================================================================

services:
  moodle:
    image: ${MOODLE_IMAGE:-leodg/ldg-courses:development}
    restart: unless-stopped
    env_file:
      - ../env/dev.env
    environment:
      # MOODLE_URL vem do dev.env; nao fixar aqui para nao amarrar o dominio.
      - ENVIRONMENT=development
      # 1 = opcache reconfere os arquivos, senao as edicoes nao tem efeito sem restart.
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=1
      # MOODLE_DEBUG e MOODLE_DEBUG_DISPLAY NAO entram aqui: environment vence o
      # env_file, e este arquivo tambem sobe na VPS. Cada ambiente define o seu
      # no dev.env.
      - MOODLE_DATA=${MOODLE_DOCKER_DATA:-/var/www/moodledata}
      - APACHE_DOCUMENT_ROOT=${APACHE_DOCUMENT_ROOT:-/var/www/html/public}
      - APACHE_LOG_DIR=/var/log/apache2
    depends_on:
      db:
        condition: service_healthy
    secrets:
    # ssl_cert/ssl_key NAO entram aqui: TLS no container e assunto LOCAL.
    # Na VPS quem termina TLS e o nginx, com o certificado do certbot, e
    # conversa HTTP com o container. Ver compose/local-tls.yml.
    #
    # config-docker.php le /run/secrets/db_user e /run/secrets/db_password.
    # Sem estes dois o Moodle conecta sem usuario e o banco recusa.
    - db_user
    - db_password
    networks:
      - moodle_network
    ports:
      # BIND_ADDR=127.0.0.1 na VPS: o container so e alcancavel pelo nginx local,
      # senao qualquer um acessa a porta alta direto e contorna o proxy/TLS.
      # Local fica 0.0.0.0 para o navegador do host chegar nele.
      - "${BIND_ADDR:-0.0.0.0}:${MOODLE_HTTP_PORT:-80}:80"
      # A 443 do container e publicada so em local-tls.yml: na VPS o nginx
      # atende a 443 do host e fala HTTP com o container.
      # A porta do Xdebug esta em local-dev.yml: na VPS ela nao e publicada.
    volumes:
      - "${MOODLE_HOST_WWWROOT:-../../}:${MOODLE_DOCKER_WWWROOT:-/var/www/html}"
      - "${MOODLE_HOST_DATA:-../../../moodledata}:${MOODLE_DOCKER_DATA:-/var/www/moodledata}"
      # - /var/www/html/.devcontainer  # no show folder
      - composer_cache:/root/.composer
      - ../php/opcache-dev.ini:/usr/local/etc/php/conf.d/opcache.ini:ro
      - ../php/php-dev-custom.ini:/usr/local/etc/php/conf.d/zzz-custom.ini:ro
      - ../apache/moodle-dev-performance.conf:/etc/apache2/conf-enabled/moodle-performance.conf:ro
      # phpu_moodledata e uploads.ini NAO entram aqui: este arquivo e o mesmo que
      # a VPS carrega (base.yml:db.yml:dev.yml no deploy.yml). Ver local-dev.yml.

    deploy:
      resources:
        limits:
          memory: 2G   # 20 workers do Apache a ~80 MB cada, mais opcache e folga
        reservations:
          memory: 512M

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s


