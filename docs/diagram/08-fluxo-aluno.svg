      <title id="08-fluxo-aluno-title">Compra do aluno: da vitrine ate a matricula</title>
      <desc id="08-fluxo-aluno-desc">Fluxo da compra de uma oferta pelo aluno, do checkout ao webhook do gateway, ate a criacao do direito de acesso e a matricula por diferenca - com o caminho da oferta gratuita reentrando na mesma entrega.</desc>
