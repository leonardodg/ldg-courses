<!doctype html>
<html lang="pt-br" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D2 — Painel ativo — mockup</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="_tokens.css" rel="stylesheet">
</head>
<body>
<div class="mockup-topbar">block_marketplace &middot; mockup D2 &middot; Dashboard (/my), empresa ativa</div>
<div class="mockup-shell" style="max-width:960px;">
  <div class="viewport-note">Viewport: 412px (coluna única) e 1280px (grid 3 colunas)</div>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="h4 mb-0">Escola Vetor <span class="badge bg-success ms-2">Ativa</span></h2>
    <span class="badge text-bg-primary">Plano Start · R$ 50/mês</span>
  </div>

  <div class="row g-3 mb-3">
    <div class="col-12 col-md-4">
      <div class="card p-3 text-center">
        <div class="text-label">Alunos matriculados</div>
        <div class="display-6">128</div>
      </div>
    </div>
    <div class="col-12 col-md-4">
      <div class="card p-3 text-center">
        <div class="text-label">Assinaturas ativas</div>
        <div class="display-6">34</div>
      </div>
    </div>
    <div class="col-12 col-md-4">
      <div class="card p-3 text-center">
        <div class="text-label">Cursos sendo vendidos</div>
        <div class="display-6">6</div>
      </div>
    </div>
  </div>

  <div class="d-flex gap-2 flex-wrap">
    <a href="#" class="btn btn-primary">Relatório completo</a>
    <a href="#" class="btn btn-outline-secondary">Ofertas</a>
    <a href="#" class="btn btn-outline-secondary">Cursos</a>
  </div>
</div>
</body>
</html>
